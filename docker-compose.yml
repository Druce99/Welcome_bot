services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: welcomebot_user
      POSTGRES_PASSWORD: welcomebot_user_09
      POSTGRES_DB: welcomebot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welcomebot_user -d welcomebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://welcomebot_user:welcomebot_user_09@db:5432/welcomebot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-c", "uv run alembic upgrade head && uv run main.py"]

volumes:
  postgres_data:
  redis_data:
